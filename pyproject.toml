[project]
name = "jsdoctor"
version = "0.1.0"
description = "Simple Python tool to extract Closure-style JSDoc from Closure-style codebases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "html5lib>=1.1",
]

[project.scripts]
jsdoctor = "jsdoctor.cli:main"

[tool.ty]

[[tool.ty.overrides]]
include = ["jsdoctor/cli.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/cli.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py", "tests/flags_test.py", "tests/linkify_test.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/source.py", "tests/scanner_test.py", "tests/source_test.py", "tests/symboltypes_test.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.2",
    "pylint>=4.0.6",
    "pytest>=8.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.coverage.report]
fail_under = 10

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyrefly]
project-includes = ["jsdoctor"]
project-excludes = ["jsdoctor/cli.py"]
ignore-missing-imports = ["*"]

[tool.pylint.main]
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.messages_control]
disable = [
    "used-before-assignment",
]

[tool.pylint.design]
max-attributes = 10

[tool.codespell]
ignore-words-list = "astroid"

[tool.bandit]
exclude_dirs = [".venv"]
skips = ["B101", "B408"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
# select = ["ALL"]
# Add rules on top of the defaults
extend-select = [
    "I",      # isort (import sorting)
    "B",      # flake8-bugbear (common design pitfalls & bugs)
    "UP",     # pyupgrade (modernize Python syntax)
    "SIM",    # flake8-simplify (simplifies nested logic)
    "S",      # flake8-bandit (security checks)
    "A",      # flake8-builtins (shadowing built-in names)
    "RUF",    # Ruff-specific rules (unused no-qa, string formats, etc.)
    "T20",    # flake8-print (flags print statements in production code)
    "C4",     # flake8-comprehensions (better list/dict comprehensions)
    "PTH",    # flake8-use-pathlib (suggests pathlib over os.path)
]
ignore = [
    "S101",  # Use of `assert` detected
]

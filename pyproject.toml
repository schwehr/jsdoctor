[project]
name = "jsdoctor"
version = "0.1.0"
description = "Simple Python tool to extract Closure-style JSDoc from Closure-style codebases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "html5lib>=1.1",
]

[project.scripts]
jsdoctor = "jsdoctor.cli:main"

[tool.ty]

[[tool.ty.overrides]]
include = ["jsdoctor/cli.py", "processjsontree.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/cli.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py", "processjsontree.py", "tests/flags_test.py", "tests/linkify_test.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/source.py", "tests/scanner_test.py", "tests/source_test.py", "tests/symboltypes_test.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.2",
    "pylint>=4.0.6",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.coverage.report]
fail_under = 10

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyrefly]
project-includes = ["jsdoctor"]
project-excludes = ["jsdoctor/cli.py", "processjsontree.py"]
ignore-missing-imports = ["*"]

[tool.pylint.main]
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.messages_control]
disable = [
    "broad-exception-raised",
    "invalid-name",
    "protected-access",
    "redefined-outer-name",
    "too-few-public-methods",
    "too-many-branches",
    "too-many-instance-attributes",
    "too-many-locals",
    "unspecified-encoding",
]

[tool.codespell]
ignore-words-list = "astroid"

[tool.bandit]
exclude_dirs = [".venv"]
skips = ["B101", "B408"]

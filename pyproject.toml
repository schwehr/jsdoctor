[project]
name = "jsdoctor"
version = "0.1.0"
description = "Simple Python tool to extract Closure-style JSDoc from Closure-style codebases"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "html5lib>=1.1",
]

[project.scripts]
jsdoctor = "jsdoctor.cli:main"

[tool.ty]

[[tool.ty.overrides]]
include = ["jsdoctor/cli.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/cli.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py", "tests/flags_test.py", "tests/linkify_test.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/source.py", "tests/scanner_test.py", "tests/source_test.py", "tests/symboltypes_test.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "coverage>=7.15.2",
    "pylint>=4.0.6",
    "pytest>=8.0.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.coverage.report]
fail_under = 10

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pyrefly]
project-includes = ["jsdoctor"]
project-excludes = ["jsdoctor/cli.py"]
ignore-missing-imports = ["*"]

[tool.pylint.main]
init-hook = "import sys; sys.path.append('.')"

[tool.pylint.messages_control]
disable = [
    "used-before-assignment",
]

[tool.pylint.design]
max-attributes = 10

[tool.codespell]
ignore-words-list = "astroid"

[tool.bandit]
exclude_dirs = [".venv"]
skips = ["B101", "B408"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "C901",    # Function is too complex
    "CPY001",  # Missing copyright notice at top of file
    "D105",    # Missing docstring in magic method
    "D401",    # First line of docstring should be in imperative mood
    "EM102",   # Exception must not use an f-string literal, assign to variable first
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "FBT003",  # Boolean positional value in function call
    "FIX002",  # Line contains TODO, consider resolving the issue
    "INP001",  # File is part of an implicit namespace package
    "N802",    # Function name should be lowercase
    "PLR0912", # Too many branches
    "PLR2004", # Magic value used in comparison
    "PLW2901", # `for` loop variable overwritten by assignment target
    "PT011",   # `pytest.raises()` is too broad
    "RET504",  # Unnecessary assignment before `return` statement
    "S101",    # Use of `assert` detected
    "SLF001",  # Private member accessed
    "TC003",   # Move standard library import into a type-checking block
    "TD003",   # Missing issue link for this TODO
    "TRY003",  # Avoid specifying long messages outside the exception class
]

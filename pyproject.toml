[project]
name = "jsdoctor"
version = "0.1.0"
description = "Simple Python tool to extract Closure-style JSDoc from Closure-style codebases"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "html5lib>=1.1",
]

[tool.ty]

[[tool.ty.overrides]]
include = ["jsdoctor.py", "processjsontree.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py", "processjsontree.py", "tests/flags_test.py", "tests/linkify_test.py"]
[tool.ty.overrides.rules]
unresolved-attribute = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/generator.py"]
[tool.ty.overrides.rules]
unresolved-import = "ignore"

[[tool.ty.overrides]]
include = ["jsdoctor/source.py", "tests/scanner_test.py", "tests/source_test.py", "tests/symboltypes_test.py"]
[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
unresolved-attribute = "ignore"

[dependency-groups]
dev = [
    "coverage>=7.15.2",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["*_test.py"]

[tool.coverage.report]
fail_under = 10

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true



